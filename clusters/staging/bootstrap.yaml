quartermaster:
  # Internal QA customer: a normal tenant that exercises customer flows on a
  # paid tier without being billed.
  tenants:
    - alias: frameworks-qa
      name: FrameWorks QA
    # Stack test tenant: the wallet-signed tenant that verify-target.sh uses
    # for "# tenant: test" scenarios (scripts/stack/test-tenant.sh).
    - alias: frameworks-stack-test
      name: FrameWorks Stack Test

accounts:
  - kind: system_operator
    tenant:
      ref: quartermaster.system_tenant
    users:
      - email: staging@frameworks.network
        role: owner
        first_name: FrameWorks
        last_name: Staging
        platform_operator: true
        password_ref:
          sops: ../../secrets/staging.env
          key: PLATFORM_ADMIN_PASSWORD
  - kind: customer
    tenant:
      ref: quartermaster.tenants[frameworks-qa]
    users:
      - email: qa@frameworks.network
        role: owner
        first_name: FrameWorks
        last_name: QA
        password_ref:
          sops: ../../secrets/staging.env
          key: QA_ACCOUNT_PASSWORD
  - kind: customer
    tenant:
      ref: quartermaster.tenants[frameworks-stack-test]
    users:
      - email: stack-test@frameworks.network
        role: owner
        first_name: FrameWorks
        last_name: Stack Test
        # Address of STACK_TEST_TENANT_WALLET_KEY in ../../secrets/staging.env.
        wallet: "0x10C4512C2075bf51A7CF723d009095309CBF3Ca1"
        password_ref:
          sops: ../../secrets/staging.env
          key: STACK_TEST_TENANT_PASSWORD

purser:
  customer_billing:
    - tenant:
        ref: quartermaster.system_tenant
      model: postpaid
      tier: free
      entitlement_overrides:
        max_concurrent_streams: 0
        max_concurrent_viewers: 0
      cluster_access: derived
    - tenant:
        ref: quartermaster.tenants[frameworks-qa]
      model: postpaid
      tier: enterprise
      cluster_access: derived
      operator_grant:
        base_fee: "0"
        waive_usage: true
        reason: Internal QA account
    - tenant:
        ref: quartermaster.tenants[frameworks-stack-test]
      model: postpaid
      tier: developer
      cluster_access: derived
      operator_grant:
        base_fee: "0"
        waive_usage: true
        reason: Stack test tenant
