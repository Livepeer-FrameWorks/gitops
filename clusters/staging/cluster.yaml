    mode: native
    hosts:
    - fw-stg-eu-1
    - fw-stg-eu-2
    - fw-stg-eu-3
    - fw-stg-us-1
    - fw-stg-us-2
    - fw-stg-us-3
  periscope-ingest:
    enabled: true
    mode: native
    hosts:
    - fw-stg-eu-1
    - fw-stg-eu-2
    - fw-stg-eu-3
interfaces:
