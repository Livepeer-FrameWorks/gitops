      VM_HTTP_AUTH_USERNAME: telemetry
  vmagent:
    enabled: true
    mode: docker
    hosts:
    - fw-stg-core
    - fw-stg-eu-1
    - fw-stg-eu-2
    - fw-stg-eu-3
    - fw-stg-us-1
    - fw-stg-us-2
