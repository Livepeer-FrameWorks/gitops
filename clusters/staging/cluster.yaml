    host: fw-stg-core
  bridge:
    enabled: true
    mode: native
    hosts:
    - fw-stg-eu-1
    - fw-stg-eu-2
    - fw-stg-eu-3
    - fw-stg-us-1
    - fw-stg-us-2
    - fw-stg-us-3
  foghorn-eu:
    enabled: true
    mode: native
    deploy: foghorn
    env_file: ../../config/staging-s3-go.env
    hosts:
    - fw-stg-eu-1
    - fw-stg-eu-2
    - fw-stg-eu-3
