    config:
      http_addr: 127.0.0.1:8935
      cli_addr: 127.0.0.1:7935
      enable_cli_tx_routes: 'false'
      trusted_proxy_cidrs: 127.0.0.1/32,::1/128
  livepeer-gateway-us:
    enabled: true
    mode: native
    deploy: livepeer-gateway
    hosts:
    - fw-stg-us-1
    - fw-stg-us-2
    - fw-stg-us-3
    cluster: staging-media-us
    config:
      http_addr: 127.0.0.1:8935
      cli_addr: 127.0.0.1:7935
      enable_cli_tx_routes: 'false'
